# Throwaway: README.md is 55 KB, which the contents API refuses with a 403 body cap, so a
# runner makes the edit instead. Dispatched once by hand and removed in a follow-up commit;
# it touches README.md only, because a push carrying workflow-file changes is refused.
name: Land README pointer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite the hooks sentence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = "Details and the escape hatches (`npm run hooks`, `WARDEN_SKIP_HOOKS=1`) are in [docs/repo-hooks.md](docs/repo-hooks.md)."
          NEW = "Details and the escape hatches (`npm run hooks`, `WARDEN_SKIP_HOOKS=1`) are in [docs/repo-hooks.md](docs/repo-hooks.md), which also covers the checks on the manual itself: a relative link, or a `#section` fragment naming a heading its target no longer has, fails CI \u2014 an anchor is derived from the heading's text, so renaming a heading means updating the links to it."

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          found = text.count(OLD)
          if found != 1:
              raise SystemExit(f"expected exactly one copy of the sentence, found {found}")
          path.write_text(text.replace(OLD, NEW), encoding="utf-8")
          print("sentence rewritten")
          PY

      - name: Refuse anything but the tested blob
        run: |
          set -euo pipefail
          expected="315bef87df07b6dcaf5c21a46f148c265fbfd0b8"
          actual="$(git hash-object README.md)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::README.md hashed to $actual, not the tested blob $expected"
            git checkout -- README.md
            exit 1
          fi
          echo "blob matches: $actual"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Darnel Hunter"
          git config user.email "68697450+innotelinc@users.noreply.github.com"
          git add README.md
          git commit -m "Point the README at the anchor rules" -m "The hooks section already sends a reader to docs/repo-hooks.md, and that document now explains why a renamed heading fails CI. Saying so on the front page means the rule is found while editing a heading rather than from a red build afterwards."
          git push origin HEAD:main
