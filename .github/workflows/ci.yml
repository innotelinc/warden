# ci.yml — the repo's own checks.
#
# The attribution guard and the conformity audit run in their own workflows;
# this one checks the structure and the landing page so a broken shared layer
# is caught here as well, and runs the typecheck and the unit suite.
#
# The suite used to run only inside the release job, which is triggered by a
# `v*` tag: a change that broke a test was discovered when someone tried to
# publish, after the commit was already on main. It runs on every push now.
name: CI

on:
  # Every branch, not only the default one: the point of running the suite here
  # is to see a break before it is merged, not after.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Typecheck and the unit suite, on every push and pull request.
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # The version the desktop package declares in `engines`.
          node-version: '24'
          cache: npm
      # A full install: the tests reach `terminal-service`, which loads
      # node-pty, so the native build has to run here rather than be skipped.
      - name: Install
        run: npm ci
      # The mobile shell has its own lockfile and nothing installed it until a
      # tag did. A version bump that rewrote a transitive dependency's version
      # here left a tarball that does not exist: every check in this job passed,
      # and both mobile jobs then died at `npm ci` on a release whose installers
      # had already been published. No test can tell a lockfile names a version
      # that exists — only the install can, and it belongs here, on the push.
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # The hook installer writes a git setting and repairs a POSIX mode, so the
  # Linux job above is where the execute-bit cases run. Windows is the other
  # half of that story and the one an operator actually meets: the installer
  # has a win32 branch that records no mode at all, and it runs from `prepare`
  # on every `npm ci`. Without this job a Windows-only break in it would first
  # show up on someone's laptop.
  hooks-windows:
    name: Hook installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # The version the desktop package declares in `engines`.
          node-version: '24'
          cache: npm
      # `npm ci` runs the `prepare` script, which is the installer under test:
      # if it cannot run on Windows, this step fails first and says so.
      - name: Install
        run: npm ci
      # The bash-only cases skip themselves on win32, so what this runs is the
      # installer itself: the setting it writes, the `core.hooksPath` it refuses
      # to replace, the opt-out, and a directory that is not a checkout.
      # A cold Windows runner starts each child process slowly, hence the timeout.
      - name: Installer integration tests
        run: npx vitest run tests/install-hooks.integration.test.ts --testTimeout=40000

  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files
        run: |
          set -euo pipefail
          for f in README.md LICENSE .env.example web/landing/index.html docs/stack.md; do
            if [ ! -f "$f" ]; then echo "::error::missing required file: $f"; exit 1; fi
          done
          echo "structure: ok"
      - name: .gitignore covers .env
        run: |
          set -euo pipefail
          grep -q '^\.env' .gitignore || { echo "::error::.gitignore does not list .env"; exit 1; }
          echo ".gitignore: ok"
      # Git skips a hook that is not executable and says nothing about it, so a
      # mode lost on the way in (the GitHub file API cannot record one) turns
      # the attribution guard and the secret scan off for every fresh clone.
      # The mode is read from the index, which is what a clone checks out.
      - name: Hook scripts are executable
        run: bash scripts/check-hook-modes.sh
      # A pattern whose dot is escaped twice still runs — it matches a literal
      # backslash instead of the text it meant, so the step passes for the wrong
      # reason. Nothing in the YAML shows the difference; this check exists
      # because that happened here, in the landing greps above.
      - name: Workflow grep patterns
        run: node scripts/check-workflow-patterns.mjs

  landing:
    name: Landing page sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The download code is checked by decoding it, so this job needs a decoder.
      # opencv is the heavy part of the job and still under a minute; comparing
      # the image's own <desc> with the manifest instead would pass an image
      # nobody can scan, which is the failure that matters.
      - name: Install the QR decoder
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/verify/bin/pip" install --quiet opencv-python-headless numpy
          echo "$RUNNER_TEMP/verify/bin" >> "$GITHUB_PATH"

      - name: Landing sanity
        run: |
          set -euo pipefail
          f=web/landing/index.html
          grep -qi '<title>' "$f" || { echo "::error::landing has no <title>"; exit 1; }
          grep -qi 'og:title' "$f" || { echo "::error::landing has no og:title"; exit 1; }
          grep -qi 'data:image/svg+xml' "$f" || { echo "::error::landing has no inline SVG favicon"; exit 1; }
          # Android ships as an APK on the release page, never through a store,
          # so the stable link is the whole download route and must stay on it.
          grep -q 'releases/latest/download/WARDEN-android.apk' "$f" || {
            echo "::error::landing has no Android APK download link"; exit 1
          }
          # A phone reaches that link by camera, so the code beside it is part of
          # the download, not decoration: a page that lost the image would still
          # pass every other check here.
          grep -q 'android-apk-qr.svg' "$f" || { echo "::error::landing has no QR code beside the APK"; exit 1; }
          [ -f web/landing/android-apk-qr.svg ] || { echo "::error::the QR image is missing from web/landing"; exit 1; }
          # The image is drawn from the manifest, so it has to decode to the APK
          # that manifest names. A code pointing at another tag is worse than no
          # code: it looks like the same download and installs a different build.
          python3 scripts/verify-qr.py || {
            echo "::error::the QR image does not decode to the release.json APK"; exit 1
          }
          # The version the page prints comes from a file this site serves, not
          # from the GitHub API: 60 unauthenticated requests an hour is a budget
          # one office behind a NAT can spend, and a browser-only caption is the
          # first thing to go blank when it does.
          if grep -q 'api\.github\.com' "$f"; then
            echo "::error::landing calls the GitHub API; it must read release.json"; exit 1
          fi
          grep -q 'release\.json' "$f" || { echo "::error::landing does not read release.json"; exit 1; }
          node -e '
            const r = require("./web/landing/release.json");
            for (const key of ["version", "tag", "publishedAt", "page", "windows", "android"]) {
              if (!r[key]) { console.error(`::error::release.json has no ${key}`); process.exit(1); }
            }
            for (const key of ["installer", "portable"]) {
              if (!r.windows[key]) { console.error(`::error::release.json has no windows.${key}`); process.exit(1); }
            }
            if (!r.android.apk) { console.error("::error::release.json has no android.apk"); process.exit(1); }
          ' || exit 1
          echo "landing: ok"

  scripts:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh' '.githooks/*')
          for f in "${files[@]}"; do bash -n "$f"; done
          echo "bash -n: ok (${#files[@]} script(s))"
