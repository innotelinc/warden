name: Build and sign release

# SignPath Foundation signs open-source projects for free, but only artifacts
# built by a GitHub workflow on GitHub-hosted runners — that is the evidence the
# certificate is issued against, so the build and the signing request live in one
# workflow.
#
# The build job always runs and always uploads unsigned installers. The sign job
# only runs once SignPath is configured, so a tagged build stays green while the
# application is pending instead of failing on missing credentials.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secret SIGNPATH_API_TOKEN                     SignPath API token with submitter rights
#   var    SIGNPATH_ORGANIZATION_ID               organization id from SignPath (enables the sign job)
#   var    SIGNPATH_PROJECT_SLUG                  project slug ("warden")
#   var    SIGNPATH_SIGNING_POLICY_SLUG           signing policy slug ("release-signing")
#   var    SIGNPATH_ARTIFACT_CONFIGURATION_SLUG   slug for signing/artifact-configuration.xml
#
# Install the SignPath GitHub App on the repository as well: it supplies the
# origin metadata SignPath verifies before signing.
#
# Signing changes the installer's bytes, so the sign job also re-derives
# latest.yml from the signed file and drops the block maps the unsigned build
# produced. Without that, the published manifest would describe a file that no
# longer exists and every self-update would fail its hash check.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the signed installers to (optional)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    # The wait below can take twenty minutes on its own, and packaging takes the
    # rest; the old limit left no room for both.
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      # The checkout opens the job because the gate below is a local action, and
      # a local action only resolves once the repository is on disk.
      - uses: actions/checkout@v4

      # The checks run on every push (ci.yml), so the commit a tag points at has
      # been verified already, or is being verified right now. Waiting for that
      # run is a gate; repeating it here was a second copy that only ever proved
      # the tag's tree, not that the commit on main had passed.
      #
      # A tag pushed a second after its commit lands here while CI is still in
      # progress, which is the race this closes: the build waits rather than
      # publishing ahead of the checks it should depend on.
      - name: Wait for CI on this commit
        uses: ./.github/actions/wait-for-ci
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The typecheck and the tests used to run here as well, which meant a break
      # in either was only found when someone tried to publish. They run on every
      # push now (ci.yml, job `checks`), against the same commit this tag points
      # at, so packaging does not repeat them.
      - name: Build installers
        # dist:ci is dist with --publish never: electron-builder otherwise tries
        # to publish implicitly whenever the commit is tagged, and fails without
        # a GitHub token even though both installers were produced.
        run: npm run dist:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish the installers
        # A tag is the release request. dist:ci builds with --publish never, so
        # nothing goes up unless this step does it: the release page, the two
        # executables, latest.yml (what electron-updater reads) and the block
        # map (what makes an update differential instead of a full download).
        # A tag push, or a manual run that names the tag to attach to.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          # Non-empty once SignPath is configured: the release then waits as a
          # draft until the sign job has replaced these with signed copies.
          SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $assets = @()
          $assets += Get-ChildItem release/WARDEN-Setup-*.exe -ErrorAction SilentlyContinue
          $assets += Get-ChildItem release/WARDEN-Portable-*.exe -ErrorAction SilentlyContinue
          $assets += Get-ChildItem release/latest.yml -ErrorAction SilentlyContinue
          $assets += Get-ChildItem release/*.blockmap -ErrorAction SilentlyContinue
          if ($assets.Count -eq 0) { throw 'no build output to publish' }
          $assets | Select-Object Name, Length | Format-Table -AutoSize

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $title = "WARDEN $($env:TAG -replace '^v','')"
            if ($env:SIGNPATH) {
              gh release create $env:TAG --draft --title $title --generate-notes
            } else {
              gh release create $env:TAG --title $title --generate-notes
            }
          } elseif ($env:SIGNPATH) {
            # The draft above only covers a first build. A re-run, or a tag moved
            # onto a fix, finds the release already published — and uploading
            # here would put these unsigned exes on the live download link,
            # which is the one thing enabling SignPath is supposed to stop. It
            # goes back to draft; the sign job publishes it again.
            gh release edit $env:TAG --draft
          }
          gh release upload $env:TAG $assets.FullName --clobber

      - name: Stage installers
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item release/WARDEN-Setup-*.exe unsigned/
          Copy-Item release/WARDEN-Portable-*.exe unsigned/
          Get-ChildItem unsigned | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: warden-unsigned
          path: unsigned/*.exe
          if-no-files-found: error

  sign:
    needs: build
    # Skips cleanly while the SignPath application is pending; skipped is not a
    # failure, and the unsigned artifacts above are still available.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The organization id turns this job on; the token is what makes it work.
      # Set without the other it used to fail inside the action with a 401 that
      # named nothing, leaving a draft nobody could explain. Checking here says
      # what is missing, and the release stays a draft until both exist.
      - name: Require the API token
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            throw 'SIGNPATH_API_TOKEN is not set, so this tag cannot be signed and the release stays a draft. Add the secret (Settings -> Secrets and variables -> Actions) or clear SIGNPATH_ORGANIZATION_ID to publish unsigned builds again.'
          }

      # For the metadata step below. The build output is not needed: the
      # installer comes from the signing request, and its hashes are taken from
      # the file SignPath hands back.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sign with SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          # The action defaults to ten minutes. A signing policy that waits for
          # a human approval is slower than that, and the release would sit as
          # a draft with the reason buried in the action log.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed

      - name: Check the signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem signed/*.exe
          if (-not $files) { throw 'SignPath returned no signed installers' }
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $stamp = if ($signature.TimeStamperCertificate) { 'timestamped' } else { 'NOT timestamped' }
            Write-Host ("{0}: {1} · {2} · {3}" -f $file.Name, $signature.Status, $signature.SignerCertificate.Subject, $stamp)
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { $bad += 1 }
          }
          if ($bad -gt 0) { throw "$bad installer(s) are not validly signed and timestamped" }
          Get-FileHash signed/*.exe -Algorithm SHA256 | ForEach-Object { Write-Host "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }

      - name: Keep the signed installers
        uses: actions/upload-artifact@v7
        with:
          name: warden-signed
          path: signed/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --draft --title "WARDEN $($env:TAG -replace '^v','')" --generate-notes }
          gh release upload $env:TAG signed/*.exe --clobber

      # latest.yml was written from the unsigned installers, so its sha512
      # describes a file that is no longer on the release: an installed WARDEN
      # downloads the signed exe, hashes it and refuses the update, and the
      # failure looks like a corrupt download rather than a stale manifest. The
      # block maps are worse — they index the unsigned bytes, so a differential
      # update built from them fails its own checksum mid-patch. Both are
      # re-derived here: the hash from what shipped, and no block map at all,
      # which makes electron-updater fetch the whole installer instead.
      - name: Refresh the update metadata
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path meta | Out-Null
          gh release download $env:TAG --pattern latest.yml --dir meta --clobber
          if ($LASTEXITCODE -ne 0) { throw 'the release has no latest.yml to correct' }

          $setup = Get-ChildItem signed/WARDEN-Setup-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'SignPath returned no installer to hash' }
          node scripts/refresh-update-metadata.mjs --latest meta/latest.yml --exe $setup.FullName --out meta/latest.yml
          if ($LASTEXITCODE -ne 0) { throw 'could not rewrite latest.yml for the signed installer' }
          gh release upload $env:TAG meta/latest.yml --clobber

          $stale = @(gh release view $env:TAG --json assets --jq '.assets[].name' | Where-Object { $_ -like '*.blockmap' })
          foreach ($name in $stale) {
            gh release delete-asset $env:TAG $name --yes
            Write-Host "removed stale differential map: $name"
          }

      - name: Publish the signed release
        # The build job leaves a draft when SignPath is configured, so nothing
        # unsigned is ever the published asset. Signatures already checked above.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit $env:TAG --draft=false
