name: Build and sign release

# SignPath Foundation signs open-source projects for free, but only artifacts
# built by a GitHub workflow on GitHub-hosted runners — that is the evidence the
# certificate is issued against, so the build and the signing request live in one
# workflow.
#
# The build job always runs and always uploads unsigned installers. The sign job
# only runs once SignPath is configured, so a tagged build stays green while the
# application is pending instead of failing on missing credentials.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secret SIGNPATH_API_TOKEN                     SignPath API token with submitter rights
#   var    SIGNPATH_ORGANIZATION_ID               organization id from SignPath (enables the sign job)
#   var    SIGNPATH_PROJECT_SLUG                  project slug ("warden")
#   var    SIGNPATH_SIGNING_POLICY_SLUG           signing policy slug ("release-signing")
#   var    SIGNPATH_ARTIFACT_CONFIGURATION_SLUG   slug for signing/artifact-configuration.xml
#
# Install the SignPath GitHub App on the repository as well: it supplies the
# origin metadata SignPath verifies before signing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the signed installers to (optional)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before packaging
        run: |
          npm run typecheck
          npm test

      - name: Build installers
        # dist:ci is dist with --publish never: electron-builder otherwise tries
        # to publish implicitly whenever the commit is tagged, and fails without
        # a GitHub token even though both installers were produced.
        run: npm run dist:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish the installers
        # A tag is the release request. dist:ci builds with --publish never, so
        # nothing goes up unless this step does it: the release page, the two
        # executables, latest.yml (what electron-updater reads) and the block
        # map (what makes an update differential instead of a full download).
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # Non-empty once SignPath is configured: the release then waits as a
          # draft until the sign job has replaced these with signed copies.
          SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $assets = @()
          $assets += Get-ChildItem release/WARDEN-Setup-*.exe -ErrorAction SilentlyContinue
          $assets += Get-ChildItem release/WARDEN-Portable-*.exe -ErrorAction SilentlyContinue
          $assets += Get-ChildItem release/latest.yml -ErrorAction SilentlyContinue
          $assets += Get-ChildItem release/*.blockmap -ErrorAction SilentlyContinue
          if ($assets.Count -eq 0) { throw 'no build output to publish' }
          $assets | Select-Object Name, Length | Format-Table -AutoSize

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $title = "WARDEN $($env:TAG -replace '^v','')"
            if ($env:SIGNPATH) {
              gh release create $env:TAG --draft --title $title --generate-notes
            } else {
              gh release create $env:TAG --title $title --generate-notes
            }
          }
          gh release upload $env:TAG $assets.FullName --clobber

      - name: Stage installers
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item release/WARDEN-Setup-*.exe unsigned/
          Copy-Item release/WARDEN-Portable-*.exe unsigned/
          Get-ChildItem unsigned | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: warden-unsigned
          path: unsigned/*.exe
          if-no-files-found: error

  sign:
    needs: build
    # Skips cleanly while the SignPath application is pending; skipped is not a
    # failure, and the unsigned artifacts above are still available.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Sign with SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check the signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem signed/*.exe
          if (-not $files) { throw 'SignPath returned no signed installers' }
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $stamp = if ($signature.TimeStamperCertificate) { 'timestamped' } else { 'NOT timestamped' }
            Write-Host ("{0}: {1} · {2} · {3}" -f $file.Name, $signature.Status, $signature.SignerCertificate.Subject, $stamp)
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { $bad += 1 }
          }
          if ($bad -gt 0) { throw "$bad installer(s) are not validly signed and timestamped" }
          Get-FileHash signed/*.exe -Algorithm SHA256 | ForEach-Object { Write-Host "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }

      - name: Keep the signed installers
        uses: actions/upload-artifact@v7
        with:
          name: warden-signed
          path: signed/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --draft --title "WARDEN $($env:TAG -replace '^v','')" --generate-notes }
          gh release upload $env:TAG signed/*.exe --clobber

      - name: Publish the signed release
        # The build job leaves a draft when SignPath is configured, so nothing
        # unsigned is ever the published asset. Signatures already checked above.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit $env:TAG --draft=false
