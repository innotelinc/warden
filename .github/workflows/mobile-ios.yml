name: Mobile (iOS)

# Archives, exports and (when asked) uploads WARDEN for iOS on a macOS runner.
#
# Needs, from repository secrets:
#   APPLE_TEAM_ID                10-character Apple Developer team id
#   APP_STORE_CONNECT_KEY_ID     App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID  API key issuer id
#   APP_STORE_CONNECT_KEY_P8     the .p8 contents
# Automatic signing then fetches the distribution profile, so no provisioning
# profile or .p12 belongs in the repository or in chat. The key must have the
# Admin (or Account Holder) role: cloud signing manages distribution signing
# only for those, and an App Manager key archives and then fails the export with
# "Cloud signing permission error". A Team Key's role is fixed once generated.
#
# A push of a v* tag builds that tag's version, uploads it to TestFlight and
# hands it to App Distribution. A manual run builds the version in
# mobile/package.json and stops at the archive unless it is asked for something:
# `upload_to_testflight` publishes, `export_signed_ipa` exports an ad hoc ipa
# for a hand-installed build and notifies nobody. Ticking neither exports
# nothing and sends nothing. A run that uploads then asks App Store Connect, in
# a loop, whether the build left processing and reached a TestFlight group with
# a tester in it — and fails when it never does.
# Without the App Store Connect key the job still archives — unsigned, for
# inspection — instead of failing on empty credentials.

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the finished build to TestFlight
        type: boolean
        default: false
      # The other half of a manual run: an ipa that installs on a registered
      # phone, with no TestFlight build and no email to testers. This is the
      # App Distribution export minus the distribution.
      export_signed_ipa:
        description: Export a signed ad hoc .ipa for sideloading (publishes nothing)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # The CI gate reads ci.yml's runs for the commit being built.
  actions: read

jobs:
  archive:
    runs-on: macos-15
    # Secrets cannot be tested in a step `if:`; hoist the key id and gate on that.
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      # App Distribution. The iOS app id does nothing until an ad hoc profile can
      # name every tester's device, so both steps below stay skipped while it is
      # unset — see docs/MOBILE.md.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      # Pinned, because the cache below is keyed on it: a floating range would
      # keep whatever version it resolved to the first time, under a key that
      # still claims to be current.
      FIREBASE_TOOLS_VERSION: '15.34.1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # A tag is a release request, and the checks for that commit ran on the
      # push. Waiting for them here means a tag on a red commit reaches neither
      # TestFlight nor the artifact list. Manual runs are gated the same way:
      # the commit is the branch tip, which CI has already seen.
      - name: Wait for CI on this commit
        uses: ./.github/actions/wait-for-ci
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # firebase-tools is a 244 MB tree, and `npx --yes` fetched it from scratch
      # on every run: this job spent 24 minutes on that in the v0.2.12 release
      # with a cold npm cache. Caching that tree is not enough on its own — npx
      # still asked the registry which version the range meant, every run, and
      # failed when it could not — so it is installed once into a fixed prefix
      # and called directly. A cache hit touches neither npm nor the network,
      # which costs seconds on a runner that has just spent fifteen minutes on
      # an archive.
      - name: Cache firebase-tools
        id: firebase-tools
        if: env.FIREBASE_IOS_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/cache@v4
        with:
          path: ~/.warden-firebase-tools
          key: firebase-tools-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Install firebase-tools
        if: env.FIREBASE_IOS_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && steps.firebase-tools.outputs.cache-hit != 'true'
        run: |
          npm install --prefix "$HOME/.warden-firebase-tools" \
            --no-audit --no-fund --loglevel=error \
            "firebase-tools@${FIREBASE_TOOLS_VERSION}"

      # A restored cache is a directory of files, not a CLI that runs, and the
      # publisher is the last step of a long job. Checking here is a second;
      # finding out after the archive is a wasted release.
      - name: Check firebase-tools
        if: env.FIREBASE_IOS_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          "$HOME/.warden-firebase-tools/node_modules/.bin/firebase" --version

      # The macos-15 image still defaults to Xcode 16.4, which builds against the
      # iOS 18.5 SDK. App Store Connect accepts nothing older than the iOS 26
      # SDK, so the newest stable Xcode on the image is selected explicitly
      # rather than taking whatever the image happens to default to.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Checked here, in seconds, because the alternative is discovering it after
      # a ten-minute archive and an upload App Store Connect then rejects with
      # "SDK version issue".
      - name: Check the iOS SDK
        run: |
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK ${SDK}"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::App Store Connect requires the iOS 26 SDK or later; this runner has ${SDK}."
            exit 1
          fi

      # The tag names the version for a release build; a manual run uses the
      # version committed in mobile/package.json. The build number is the run
      # number, which only ever increases, so App Store Connect accepts every
      # upload of the same marketing version.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "WARDEN ${VERSION} (${GITHUB_RUN_NUMBER})"

      # One decision for everything after the archive: `value` uploads, `sideload`
      # exports an ipa and stops. They are separate outputs because the two
      # answers differ on what happens at the end — an upload reaches TestFlight
      # and every tester's inbox, a sideload reaches an artifact and nobody else.
      # Both are read by the steps below rather than each deciding for itself,
      # which is how a run that asked for nothing once exported an ipa and mailed
      # it to the tester group.
      - name: Decide whether to publish
        id: upload
        env:
          REQUESTED: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
          SIDELOAD_REQUESTED: ${{ inputs.export_signed_ipa }}
        run: |
          if [ -z "${ASC_KEY_ID:-}" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "sideload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No App Store Connect key configured — archiving unsigned for inspection; nothing is exported or published."
          elif [ "${REQUESTED}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "sideload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build will be uploaded to TestFlight and App Distribution."
          elif [ "${SIDELOAD_REQUESTED}" = "true" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "sideload=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Exporting a signed ad hoc .ipa for sideloading — nothing is uploaded to TestFlight and no tester is notified."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "sideload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing requested — the run stops at the archive. Tick upload_to_testflight to publish, or export_signed_ipa for a signed .ipa."
          fi

      - name: Install
        run: npm ci && npm run build && npx cap sync ios

      - name: Pods
        working-directory: mobile/ios/App
        run: pod install --repo-update

      - name: Write App Store Connect key
        if: env.ASC_KEY_ID != ''
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        working-directory: mobile/ios/App
        run: |
          args=(-workspace App.xcworkspace
                -scheme App
                -configuration Release
                -destination 'generic/platform=iOS'
                -archivePath "$RUNNER_TEMP/WARDEN.xcarchive"
                MARKETING_VERSION="$VERSION"
                CURRENT_PROJECT_VERSION="$BUILD")
          # Signed here, the archive stops before it compiles: automatic signing
          # asks Apple for a *development* profile for the app target, and a
          # development profile needs a registered device. A runner has none,
          # which is why every store build failed with "Your team has no devices
          # from which to generate a provisioning profile".
          #
          # Distribution signing belongs to the export, which asks for an App
          # Store profile — a profile with no device list — and can create the
          # certificate from the App Store Connect key. So the archive is built
          # unsigned and signed on the way out.
          if [ -n "${KEY_ID:-}" ] && [ -n "${ISSUER_ID:-}" ] \
             && [ -f "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" ]; then
            echo "::notice::archiving unsigned; the export step applies App Store signing"
            args+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="")
          else
            echo "::notice::no App Store Connect key configured — archiving unsigned for inspection"
            args+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild "${args[@]}" archive

      # `destination=upload` hands the build to App Store Connect from the same
      # export Xcode already does, so TestFlight needs no altool/Transporter step.
      # It only runs when the build is being uploaded: an export is signing and
      # network on top of the archive, and a manual run that asked for nothing
      # should not pay for either.
      - name: Export ipa
        if: steps.upload.outputs.value == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WARDEN.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # A stable name for the artifact, and for the human who has to pick it out
      # of the Downloads folder. With `destination=upload` Xcode sends the build
      # to App Store Connect and writes no .ipa at all, so a missing export
      # directory is the success case, not a failure — this step going red after
      # a successful upload is how a green run looks like a broken one.
      - name: Name the build
        if: steps.upload.outputs.value == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -d "$RUNNER_TEMP/export" ]; then
            echo "::notice::Uploaded to TestFlight — Xcode wrote no .ipa for destination=upload."
            exit 0
          fi
          if [ -f "$RUNNER_TEMP/export/App.ipa" ]; then
            mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/export/WARDEN-${VERSION}.ipa"
          fi
          ls -la "$RUNNER_TEMP/export"

      # App Distribution cannot install an App Store build: an ad hoc profile has
      # to name every tester's UDID, and a tag build above is not even written to
      # disk because `destination=upload` sends it straight to TestFlight. So this
      # is a second export of the same archive with a different method, run only
      # once an iOS app id is configured — before that there is no profile to
      # make, because no device is registered — and only when this run is
      # uploading or was asked for a sideload build, so a manual build nobody
      # asked for notifies nobody.
      - name: Export an ad hoc ipa
        if: steps.upload.outputs.sideload == 'true' || (env.FIREBASE_IOS_APP_ID != '' && steps.upload.outputs.value == 'true')
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/AdHocOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WARDEN.xcarchive" \
            -exportPath "$RUNNER_TEMP/adhoc" \
            -exportOptionsPlist "$RUNNER_TEMP/AdHocOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          mv "$RUNNER_TEMP/adhoc/App.ipa" "$RUNNER_TEMP/adhoc/WARDEN-${VERSION}.ipa"

      # A green export has only proven that Xcode found *a* profile: one that
      # names no phone still signs, and the failure then shows up on the phone as
      # "Unable to Install" after the invite has gone out. So the profile is read
      # back out of the ipa that is about to be uploaded and compared with the
      # devices the account has. It runs before the upload for that reason.
      - name: Check the ad hoc profile names the registered devices
        if: steps.upload.outputs.sideload == 'true' || (env.FIREBASE_IOS_APP_ID != '' && steps.upload.outputs.value == 'true')
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/scripts/verify-adhoc-profile.py" "$RUNNER_TEMP/adhoc/WARDEN-${VERSION}.ipa"

      - name: Publish to Firebase App Distribution
        if: env.FIREBASE_IOS_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && steps.upload.outputs.value == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          "$HOME/.warden-firebase-tools/node_modules/.bin/firebase" appdistribution:distribute "$RUNNER_TEMP/adhoc/WARDEN-${VERSION}.ipa" \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups "${FIREBASE_TESTER_GROUPS:-testers}" \
            --release-notes "WARDEN ${VERSION} — build ${GITHUB_RUN_NUMBER}"

      # "Upload succeeded" is not "a tester can install it". App Store Connect
      # processes an upload for 5-15 minutes, can still throw it out, and then
      # hands it to nobody until a TestFlight group that has testers in it holds
      # it. Every earlier release ended the moment Xcode's upload printed, and
      # the question of whether the build was ever testable was left to whoever
      # opened the TestFlight page. This asks Apple, in a loop, and fails the tag
      # when the build never gets there — a release that reports success while
      # nothing is installable is the failure worth catching.
      - name: Wait for TestFlight to publish the build
        if: steps.upload.outputs.value == 'true'
        # The loop gives up on its own after 45 minutes; the step timeout is the
        # backstop for a hung API call, not the deadline.
        timeout-minutes: 55
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ios-build-status.py" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --wait-minutes 45 \
            --await-testers

      # An unsigned archive has no .ipa; keep the archive for inspection instead.
      # `always()` so a failed export still leaves the archive behind: the export
      # step is where signing permissions surface, and without this the run that
      # reports the problem also throws away the evidence.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warden-ios
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/adhoc/*.ipa
            ${{ runner.temp }}/WARDEN.xcarchive
          if-no-files-found: error
