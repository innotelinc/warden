name: iOS build status

# Asks App Store Connect what became of the iOS builds that were uploaded.
#
# A build prints "Upload succeeded" long before TestFlight will hand it to a
# tester: App Store Connect processes it for 5-15 minutes afterwards, and only
# Apple can say when that has finished — or if it failed. Nothing is built,
# signed or uploaded here, so it runs on Ubuntu in seconds and costs nothing.
#
# Reads the same four repository secrets as Mobile (iOS).
#
#   gh workflow run ios-build-status.yml
#   gh workflow run ios-build-status.yml -f wait_minutes=20 -f build_version=0.2.4
#
# `submit_for_review` is the one input that changes what a reviewer sees: it
# sends `submit_version` to App Review through the review-submission API, and
# only when the submission check reports zero gaps and the version is in
# PREPARE_FOR_SUBMISSION. Both are read by the script on the runner, so the tick
# cannot skip either. It is off by default, and nothing here submits on a tag.
# `submit_dry_run` runs the same thing and sends nothing, which is how the first
# live submission is read before it happens.

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Keep checking until processing finishes (0 reports once)
        type: number
        default: 0
      build_version:
        description: Only report this marketing version, e.g. 0.2.4
        type: string
        default: ''
      build_number:
        description: Follow this build number, waiting even before Apple lists it
        type: string
        default: ''
      groups:
        description: Also report the TestFlight groups and which builds they hold
        type: boolean
        default: true
      add_build_to_group:
        description: Add the reported build to this TestFlight group (must be VALID)
        type: string
        default: ''
      # The same check Mobile (iOS) makes after an upload, run on demand — the
      # release job's step refuses to go green until this passes, so it should be
      # possible to ask the question without cutting a tag.
      await_testers:
        description: Wait until a TestFlight group with a tester holds the build (the release gate)
        type: boolean
        default: false
      submission:
        description: Report what the current App Store version still needs before submitting
        type: boolean
        default: false
      # Sending a version to App Review is the only irreversible input here, so it
      # is its own tick and off by default. Looking at a build and submitting it
      # are different decisions.
      submit_for_review:
        description: Submit the version to App Review if the check reports zero gaps (irreversible)
        type: boolean
        default: false
      submit_version:
        description: Marketing version to submit; it has to be the app's newest
        type: string
        default: '1.0'
      submit_dry_run:
        description: With submit_for_review, run the gates and print the plan without sending
        type: boolean
        default: false
      # Which app a build lands in is decided by a bundle id, and the account can
      # hold records for apps whose code lives elsewhere. This prints them all, so
      # an identifier seen in the portal can be traced to a repository.
      apps:
        description: List every app record in the account (which bundle ids exist) and exit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The script signs its own token with openssl, so nothing is installed.
      - name: Write App Store Connect key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "${KEY_P8:-}" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 is not set — add the App Store Connect secrets first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Inputs arrive through the environment, never through the command line,
      # so a version string cannot become shell syntax.
      - name: Report build status
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          WAIT_MINUTES: ${{ inputs.wait_minutes || 0 }}
          BUILD_VERSION: ${{ inputs.build_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          GROUPS: ${{ inputs.groups }}
          ADD_TO_GROUP: ${{ inputs.add_build_to_group }}
          AWAIT_TESTERS: ${{ inputs.await_testers }}
          SUBMISSION: ${{ inputs.submission }}
          APPS: ${{ inputs.apps }}
        run: |
          args=(--wait-minutes "${WAIT_MINUTES:-0}")
          if [ "${APPS:-false}" = "true" ]; then
            args+=(--apps)
          fi
          if [ "${SUBMISSION:-false}" = "true" ]; then
            args+=(--submission)
          fi
          if [ "${GROUPS:-false}" = "true" ]; then
            args+=(--groups)
          fi
          if [ -n "${ADD_TO_GROUP:-}" ]; then
            args+=(--add-build-to "$ADD_TO_GROUP")
          fi
          if [ "${AWAIT_TESTERS:-false}" = "true" ]; then
            args+=(--await-testers)
          fi
          if [ -n "${BUILD_VERSION:-}" ]; then
            args+=(--build-version "$BUILD_VERSION")
          fi
          if [ -n "${BUILD_NUMBER:-}" ]; then
            args+=(--build-number "$BUILD_NUMBER")
          fi
          python3 scripts/ios-build-status.py "${args[@]}"

      # The script asks App Store Connect for the version's state and runs the
      # submission check itself, so neither gate can be skipped by leaving the
      # other input unticked. A refusal exits non-zero and writes nothing.
      - name: Submit for review
        if: ${{ inputs.submit_for_review }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          SUBMIT_VERSION: ${{ inputs.submit_version }}
          SUBMIT_DRY_RUN: ${{ inputs.submit_dry_run }}
        run: |
          args=(--version "${SUBMIT_VERSION:-1.0}")
          if [ "${SUBMIT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/ios-submit-for-review.py "${args[@]}"
