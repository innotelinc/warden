name: iOS listing

# Writes the App Store listing copy from mobile/store/ios/listing.json into
# App Store Connect: the version's description, keywords, promotional text and
# URLs, the app name and subtitle, the privacy policy URL, the primary category,
# the age rating's unrestricted-web-access answer, and the review notes.
#
# It also writes the App Review contact — a name, a phone and an email — from
# three repository variables: APP_REVIEW_CONTACT_NAME (first and last name),
# APP_REVIEW_CONTACT_PHONE (country code included) and APP_REVIEW_CONTACT_EMAIL.
# They are variables rather than secrets because the same three values are
# published on the record. Unset, the contact is left exactly as it is; half set,
# the run fails instead of writing a record App Review cannot use.
#
# It does not touch the screenshots (which must be captured from the running
# app) or What's New (optional for a first version).
#
# Reads the same four repository secrets as the other iOS workflows.
#
#   gh workflow run ios-listing.yml                     # dry run, writes nothing
#   gh workflow run ios-listing.yml -f dry_run=false    # apply

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the changes without writing them
        type: boolean
        default: true
      attach_build:
        description: Attach this TestFlight build number to the version page
        type: string
        default: ''

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write App Store Connect key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "${KEY_P8:-}" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 is not set — add the App Store Connect secrets first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Write the listing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          DRY_RUN: ${{ inputs.dry_run }}
          ATTACH_BUILD: ${{ inputs.attach_build }}
          APP_REVIEW_CONTACT_NAME: ${{ vars.APP_REVIEW_CONTACT_NAME }}
          APP_REVIEW_CONTACT_PHONE: ${{ vars.APP_REVIEW_CONTACT_PHONE }}
          APP_REVIEW_CONTACT_EMAIL: ${{ vars.APP_REVIEW_CONTACT_EMAIL }}
        run: |
          if [ -n "${ATTACH_BUILD:-}" ]; then
            python3 scripts/ios-fill-listing.py --attach-build "$ATTACH_BUILD"
          else
            python3 scripts/ios-fill-listing.py
          fi
