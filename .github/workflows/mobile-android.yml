name: Mobile (Android)

# Builds a signed .aab for Play and, when it is configured, puts it on the
# internal testing track.
#
# Signing material comes from repository secrets (see docs/MOBILE.md for how to
# make them — the keystore is the app's upload identity, so it is generated on
# the owner's machine, never here):
#   ANDROID_KEYSTORE_BASE64   `base64 -w0 warden-upload.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
#   PLAY_SERVICE_ACCOUNT_JSON Google Cloud service account key with the Play
#                             Android Developer API enabled and "Release apps to
#                             testing tracks" in Play Console.
#
# Without the keystore the workflow still builds and uploads an unsigned bundle
# for inspection, so a fork or a fresh clone can be checked — and the APK step
# then fails on purpose, because a debug-signed APK is not something to publish.
# Without the service account it stops at the artifact, so it never publishes.
#
# PLAY_PUBLISH (repository *variable*, not a secret) turns the Play upload on.
# It is off by default: Play only accepts a bundle for a package that already
# exists there, and the app record plus the service account's invitation are set
# up in Play Console by hand. Until that is done, Firebase App Distribution and
# the release page are the whole release, and a tag stays green.
#
# A manual run that ticks `dry_run` builds and signs the bundle and skips the
# upload, which is how the pipeline (and the CI gate) is exercised without
# spending a version code on the internal track. A tag push publishes.
#
# After everything is published, the `install` job boots an emulator and installs
# the APK this run produced. apksigner proves the bytes are signed; only a device
# proves the package installs.
#
# Play requires targetSdk 36 for submissions from 31 August 2026; see
# mobile/android/variables.gradle.

on:
  workflow_dispatch:
    inputs:
      # Play has no undo, so a run that exercises this workflow — the CI gate,
      # the signing, the bundle — should be able to stop short of the track.
      # A tag push ignores this: publishing is what a tag asks for.
      dry_run:
        description: Build and sign without uploading to Play
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  # Write, not read: a tag attaches the APK to the release page the desktop
  # job publishes.
  contents: write
  # The CI gate reads ci.yml's runs for the commit being built.
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    # The install check below asserts that the version the device reports is the
    # one this run built, rather than a stale artifact.
    outputs:
      version: ${{ steps.version.outputs.version }}
    # A secret cannot be read in a step's `if:` — GitHub rejects the whole file.
    # Hoist them to the job env and test those instead.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # App Distribution. The service account is a secret, so it is hoisted for
      # the same reason as the others: a step's `if:` cannot read one.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      # Pinned, because the cache below is keyed on it: a floating range would
      # keep whatever version it resolved to the first time, under a key that
      # still claims to be current.
      FIREBASE_TOOLS_VERSION: '15.34.1'
      # Hoisted so the steps below can test it; empty means "not configured yet".
      PLAY_PUBLISH: ${{ vars.PLAY_PUBLISH }}
      # Empty on a tag push, which is what keeps publishing the tag's job.
      DRY_RUN: ${{ inputs.dry_run }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # A tag is a release request, and the checks for that commit ran on the
      # push. Waiting for them here means a tag on a red commit never reaches
      # the internal testing track. Manual runs are gated the same way: the
      # commit is the branch tip, which CI has already seen.
      - name: Wait for CI on this commit
        uses: ./.github/actions/wait-for-ci
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # firebase-tools is a 244 MB tree, and `npx --yes` fetched it from scratch
      # on every run — 24 minutes on the iOS job with a cold npm cache. Caching
      # that tree is not enough on its own: npx still asked the registry which
      # version the range meant, on every run, and failed without one. So it is
      # installed once into a fixed prefix and called directly, which on a hit
      # touches neither npm nor the network.
      - name: Cache firebase-tools
        id: firebase-tools
        if: env.FIREBASE_ANDROID_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/cache@v4
        with:
          path: ~/.warden-firebase-tools
          key: firebase-tools-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Install firebase-tools
        if: env.FIREBASE_ANDROID_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && steps.firebase-tools.outputs.cache-hit != 'true'
        run: |
          npm install --prefix "$HOME/.warden-firebase-tools" \
            --no-audit --no-fund --loglevel=error \
            "firebase-tools@${FIREBASE_TOOLS_VERSION}"

      # A restored cache is a directory of files, not a CLI that runs, and the
      # publisher is the last step of a long job. Checking here is a second;
      # finding out after the build is a wasted release.
      - name: Check firebase-tools
        if: env.FIREBASE_ANDROID_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          "$HOME/.warden-firebase-tools/node_modules/.bin/firebase" --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The tag names the version for a release build; a manual run uses the
      # version committed in mobile/package.json. The version code is the run
      # number, which only ever increases — Play rejects a repeat, and there is
      # no reliable way to ask it what the highest one is.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "WARDEN ${VERSION} (${GITHUB_RUN_NUMBER})"

      - name: Install
        run: npm ci

      - name: Build web shell and sync native project
        run: npm run build && npx cap sync android

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/warden-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../keystore/warden-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Bundle (signed when secrets exist)
        working-directory: mobile/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          args=(bundleRelease --no-daemon
                "-PwardenVersionName=${VERSION}"
                "-PwardenVersionCode=${CODE}")
          if [ ! -f keystore.properties ]; then
            echo "::notice::No keystore configured — building an unsigned bundle for inspection."
            args+=(-Punsigned=true)
          fi
          ./gradlew "${args[@]}"

      # A stable name, so the file in the artifact or the Downloads folder says
      # which build it is without opening it.
      - name: Name the bundle
        working-directory: mobile/android/app/build/outputs/bundle/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f app-release.aab ]; then
            mv app-release.aab "WARDEN-${VERSION}.aab"
          fi
          ls -la

      # Play takes an .aab, and a phone cannot install one. This is the same
      # build as an APK, which is the free way onto a test device: no Play
      # account, no review, no fee. With the keystore it is signed with the
      # upload key and is the artefact a later Play release comes from; without
      # it the debug variant is built instead, so a build can still be tried.
      - name: Build installable APK
        working-directory: mobile/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          common=(--no-daemon
                  "-PwardenVersionName=${VERSION}"
                  "-PwardenVersionCode=${CODE}")
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease "${common[@]}"
            built=app/build/outputs/apk/release/app-release.apk
          else
            echo "::notice::No keystore configured — the APK is debug-signed: it installs, but moving to a release-signed build later needs an uninstall first."
            ./gradlew assembleDebug "${common[@]}"
            built=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$built" "$RUNNER_TEMP/apk/WARDEN-${VERSION}.apk"
          echo "APK_PATH=$RUNNER_TEMP/apk/WARDEN-${VERSION}.apk" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@v4
        with:
          name: warden-android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

      # A missing keystore produces a debug-signed APK with the same name and the
      # same build behind it, and nothing downstream can tell the difference:
      # Firebase and the release page would publish it, testers would install it,
      # and Android then refuses every release-signed update until each install is
      # removed by hand. So the signer certificate is checked before anything is
      # distributed. It runs after the artifact upload on purpose — a run that
      # fails here still leaves the APK behind to look at.
      - name: Check the APK is signed with the upload key
        run: python3 "$GITHUB_WORKSPACE/scripts/verify-apk-signature.py" "$APK_PATH"

      # The TestFlight-shaped path for Android: testers are emailed an invite and
      # install the same APK. No cost, and no Play account. Skipped until the
      # Firebase app id and its service account exist, so a fork, a dry run and
      # the current setup all behave exactly as they did before.
      - name: Publish to Firebase App Distribution
        if: env.DRY_RUN != 'true' && env.FIREBASE_ANDROID_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          "$HOME/.warden-firebase-tools/node_modules/.bin/firebase" appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "${FIREBASE_TESTER_GROUPS:-testers}" \
            --release-notes "WARDEN ${VERSION} — build ${GITHUB_RUN_NUMBER}"

      - name: Say what happened
        if: env.DRY_RUN == 'true' || (env.ANDROID_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON == '') || env.PLAY_PUBLISH != 'true'
        run: |
          if [ "${DRY_RUN}" = 'true' ]; then
            # Say which bundle this run produced: without the keystore secret the
            # bundle is unsigned, and claiming otherwise sends someone looking
            # for a signature that was never made.
            if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
              echo "::notice::Dry run — the bundle was built and signed but not uploaded to Play."
            else
              echo "::notice::Dry run — an unsigned bundle was built and not uploaded to Play."
            fi
            exit 0
          fi
          if [ "${PLAY_PUBLISH}" != 'true' ]; then
            echo "::notice::Play publishing is off — this release went to Firebase and the release page. Set the PLAY_PUBLISH repository variable to true once the app exists in Play Console and the service account has release access."
            exit 0
          fi
          echo "::notice::Signed .aab built but PLAY_SERVICE_ACCOUNT_JSON is not set — upload it in the Play Console, or add the service account to publish from here."

      # The desktop release job owns the release page for a tag and this job
      # reaches here first — its Gradle build is minutes shorter than the
      # electron-builder one — so wait for that page rather than create a second.
      # Fifteen minutes, because the page only appears after the installers are
      # built. The asset keeps a constant name on purpose: .../releases/latest/
      # download/WARDEN-android.apk is a link that survives every version, which
      # is the one worth bookmarking on the phone you test on.
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/apk/WARDEN-${VERSION}.apk" "$RUNNER_TEMP/apk/WARDEN-android.apk"
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$RUNNER_TEMP/apk/WARDEN-android.apk" --clobber
              exit 0
            fi
            echo "waiting for the release page for $TAG (${attempt}/60)"
            sleep 15
          done
          echo "::error::No release page for $TAG after fifteen minutes; the APK is on this run's artifacts."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: warden-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Internal testing needs no review, so this is the fastest way onto a phone
      # for someone who uses Play. Two things outside this repository have to be
      # true first: the package exists in Play Console with one release uploaded
      # by hand (the API cannot create the app), and the service account has been
      # invited to it with release rights. That is what PLAY_PUBLISH waits for.
      #
      # It comes last on purpose. A tag's free channels — the Firebase release and
      # the APK on the release page — have already happened by now, so a Play
      # rejection cannot take them back or strand the asset.
      - name: Upload to Play internal testing
        if: env.DRY_RUN != 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.PLAY_PUBLISH == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: us.innotel.warden
          releaseFiles: mobile/android/app/build/outputs/bundle/release/WARDEN-${{ steps.version.outputs.version }}.aab
          tracks: internal
          status: completed

  # A signature proves the bytes are signed; only a device proves the package
  # installs. Every APK before this job was checked with apksigner and never
  # installed anywhere, so "it installs" was an inference. This boots a pristine
  # emulator — the state a first-time user's phone is in — installs the APK this
  # run published, and launches it.
  #
  # It runs after `bundle`, which has published by then: a red run here means
  # exactly what it says — the release is out and its APK did not install — not
  # that something could have been stopped.
  install:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
      APP_ID: us.innotel.warden
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: warden-android-apk
          path: ${{ runner.temp }}/apk

      # The runner has /dev/kvm but grants it to the kvm group, and the emulator
      # exits rather than fall back to software CPU emulation. Without this the
      # failure reads like a missing system image.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch the APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The AOSP image: nothing here needs Play services, and it is the
          # smaller download.
          api-level: 35
          arch: x86_64
          disable-animations: true
          # No display and no GPU on the runner; swiftshader renders in software.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # /bin/sh, not bash — dash rejects `set -o pipefail` as an illegal
          # option and exits 2 before running a single command, which reads like
          # a broken job rather than a broken script.
          script: |
            set -eu

            APK="$(ls "${{ runner.temp }}"/apk/*.apk | head -n1)"
            echo "installing ${APK##*/} on a device with nothing on it"

            adb install "$APK"
            adb shell pm list packages | grep -qx "package:${APP_ID}" \
              || { echo "::error::${APP_ID} is not installed, although adb install reported success."; exit 1; }

            # The artifact and the published asset share a name and a build
            # number, so the version a device reports is what tells them apart.
            INSTALLED="$(adb shell dumpsys package "$APP_ID" | sed -n 's/^ *versionName=\(.*\)$/\1/p' | head -n1 | tr -d '\r')"
            echo "the device reports version ${INSTALLED}, this run built ${VERSION}"
            if [ "$INSTALLED" != "$VERSION" ]; then
              echo "::error::the device has ${INSTALLED} but this run built ${VERSION} — the installed artifact is not the one that was published."
              exit 1
            fi

            # Resolved rather than hardcoded: an APK with no launcher activity
            # installs perfectly and is then unreachable from the home screen.
            ACTIVITY="$(adb shell cmd package resolve-activity --brief "$APP_ID" | tail -n1 | tr -d '\r')"
            echo "launcher activity: ${ACTIVITY}"
            case "$ACTIVITY" in
              "$APP_ID"/*) ;;
              *) echo "::error::the APK has no launcher activity, so nothing happens when the icon is tapped."; exit 1 ;;
            esac

            adb shell am start -W -n "$ACTIVITY" | tee "${{ runner.temp }}/launch.txt"
            grep -q 'Status: ok' "${{ runner.temp }}/launch.txt" \
              || { echo "::error::the launch did not report Status: ok — this is what tapping the icon does."; exit 1; }

            # A launch that reports ok and dies a second later is still broken.
            sleep 8
            RESUMED="$(adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|mResumedActivity' | tr -d '\r' || true)"
            echo "foreground: ${RESUMED}"
            case "$RESUMED" in
              *"$APP_ID"*) ;;
              *) echo "::error::WARDEN launched but is not the foreground activity."; exit 1 ;;
            esac

            PID="$(adb shell pidof "$APP_ID" | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "::error::the process was gone eight seconds after launch (crash buffer below)."
              adb logcat -d -b crash | tail -n 40
              exit 1
            fi
            echo "running as pid ${PID}, eight seconds after a cold start"

