name: Apply README hooks section

# Temporary: workflow_dispatch only resolves workflows on the default branch, so
# this cannot live on a side branch. It lands the 55 KB README from inside the
# runner instead of through the contents API, verifies the result against the
# blob tested locally, and removes itself in the same commit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Insert the Repo hooks section
        shell: bash
        env:
          EXPECTED_BLOB: c6e20b3c626a17500ee78f2f3a51fa2beadafa28
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")

          anchor = "### Verification\n"
          if text.count(anchor) != 1:
              sys.exit(f"expected exactly one anchor, found {text.count(anchor)}")
          if "### Repo hooks" in text:
              sys.exit("README already carries the Repo hooks section")

          block = """### Repo hooks

          `npm install` and `npm ci` run [`scripts/install-hooks.mjs`](scripts/install-hooks.mjs) through the `prepare` script, which points the clone at `.githooks` — so the attribution guard and the secret scan run before a commit is written, on a fresh clone, with no setup step to remember. It writes one clone-local setting (`core.hooksPath`), restores the hooks' execute bits when a checkout or archive dropped them, leaves global Git config alone, and refuses to replace a `core.hooksPath` pointed somewhere else on purpose. Details and the escape hatches (`npm run hooks`, `WARDEN_SKIP_HOOKS=1`) are in [docs/repo-hooks.md](docs/repo-hooks.md).

          """

          readme.write_text(text.replace(anchor, block + anchor), encoding="utf-8")

          actual = subprocess.run(
              ["git", "hash-object", "README.md"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          expected = os.environ["EXPECTED_BLOB"]
          if actual != expected:
              subprocess.run(["git", "checkout", "--", "README.md"], check=True)
              sys.exit(f"README hashed {actual}, expected {expected}: not committed")
          print(f"README blob matches {actual}")
          PY

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WARDEN docs"
          git config user.email "noreply@github.com"
          {
            echo "Point the README at the repo hooks"
            echo
            echo "The hooks install themselves on npm install, but the manual never"
            echo "said so, so the guard was discoverable only from the hook headers."
            echo
            echo "The workflow that wrote this removes itself here, so the tree keeps"
            echo "only the manual change."
          } > /tmp/readme-message.txt
          git rm -q .github/workflows/tmp-apply-readme.yml
          git add README.md
          git commit -F /tmp/readme-message.txt
          git push origin HEAD:main
          git log --oneline -1
          git ls-files .github/workflows/ | wc -l
